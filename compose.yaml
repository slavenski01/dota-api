name: dota-api

x-app: &app
  image: ${DOTA_IMAGE:-dota-api:local}
  build:
    context: .
    args:
      REGISTRY: ${DOTA_IMAGE_REGISTRY:-docker.io/library}
  init: true
  environment: &environment
    DATABASE_URL: postgresql://dota:${POSTGRES_PASSWORD:?Run node scripts/local.mjs init first}@db:5432/dota
    STORAGE_ROOT: /var/lib/dota/storage
    OPENDOTA_API_KEY: ${OPENDOTA_API_KEY:-}
    NODE_USE_ENV_PROXY: "1"
    HTTP_PROXY: ${DOTA_HTTP_PROXY:-}
    HTTPS_PROXY: ${DOTA_HTTP_PROXY:-}
    NO_PROXY: localhost,127.0.0.1,::1,db
    DOTA_COACH_MODEL: ${DOTA_COACH_MODEL:-gpt-6-astra}
    DOTA_COACH_REASONING: ${DOTA_COACH_REASONING:-medium}
    DOTA_COACH_DAILY_RUNS: ${DOTA_COACH_DAILY_RUNS:-10}
    DOTA_COACH_TOTAL_RUNS: ${DOTA_COACH_TOTAL_RUNS:-100}
  volumes:
    - storage:/var/lib/dota/storage
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  db:
    image: ${DOTA_IMAGE_REGISTRY:-docker.io/library}/postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_USER: dota
      POSTGRES_DB: dota
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/local.mjs init first}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dota -d dota"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    shm_size: 256mb
    mem_limit: 1g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  migrate:
    <<: *app
    command: ["node", "scripts/migrate.mjs"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
  web:
    <<: *app
    ports:
      - "127.0.0.1:${DOTA_PORT:-3000}:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs", "web"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 1g
  worker:
    <<: *app
    environment:
      <<: *environment
      DOTA_COACH_BRIDGE_DIR: /var/lib/dota/storage/.tmp/coach-bridge
    command: ["node", "--max-old-space-size=256", "apps/worker/dist/index.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs", "worker"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 45s
    mem_limit: 3g

volumes:
  postgres:
  storage:
